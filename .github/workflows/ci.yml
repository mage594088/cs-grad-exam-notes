name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pytest flake8

      - name: Run tests
        run: python -m pytest

      - name: Run flake8
        run: python -m flake8 tools tests

      - name: Run Markdown lint
        run: python -m tools.md_lint
